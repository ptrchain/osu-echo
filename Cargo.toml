[package]
name = "osu-echo"
version = "1.1.0"
edition = "2021"
description = "A local osu! private server written in Rust"

[features]
default = []
# Opt-in support for osu! clients too old to negotiate TLS 1.2 (`--legacy-tls` at runtime).
#
# It needs its own TLS stack: Windows' SChannel refuses TLS 1.0/1.1 unless a machine-wide registry
# policy is relaxed, which would weaken every other program on the PC, and rustls does not implement
# those versions at all. So this pulls in a vendored OpenSSL, which ignores that policy and keeps the
# legacy listener confined to this process. Vendored OpenSSL is a C build and needs perl, which is
# why it is not part of a normal build. Without this feature the server still accepts `--legacy-tls`,
# using a Python front-end instead (see README).
legacy-tls = ["dep:openssl", "dep:tokio-openssl"]

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
bytes = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json"] }
rosu-pp = "4.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
lzma-rs = "0.3"
md5 = { package = "md-5", version = "0.10" }
base64 = "0.22"
colored = "2"
bitflags = "2"
url = "2"
percent-encoding = "2"
notify = "6"
dotenvy = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
simple-rijndael = "0.3.2"
sha2 = "0.11.0"
tokio-rustls = "0.26"
rustls-pemfile = "2"
rustls-pki-types = "1"
rcgen = "0.13"
crossterm = "0.29.0"
rust-embed = { version = "8.5", features = ["include-exclude"] }
mime_guess = "2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[target."cfg(windows)".build-dependencies]
winres = "0.1.12"

# Only compiled with `--features legacy-tls`; see the feature comment above.
[target."cfg(windows)".dependencies]
openssl = { version = "0.10", features = ["vendored"], optional = true }
tokio-openssl = { version = "0.6", optional = true }
