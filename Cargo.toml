[package]
name = "osu-echo"
version = "1.0.0"
edition = "2021"
description = "A local osu! private server written in Rust"

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
bytes = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json"] }
rosu-pp = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
lzma-rs = "0.3"
md5 = { package = "md-5", version = "0.10" }
base64 = "0.22"
colored = "2"
bitflags = "2"
url = "2"
percent-encoding = "2"
notify = "6"
dotenvy = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
simple-rijndael = "0.3.2"
sha2 = "0.11.0"
tokio-rustls = "0.26"
rustls-pemfile = "2"
rustls-pki-types = "1"
rcgen = "0.13"
crossterm = "0.29.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
